          links: [{ text: "Страница VK", url: "https://vk.com/bagazhnik" }],
          gallery: ["/img/h/bagazhnik.jpg"],
        },

        tvorch: {
          title: "Творческие личности",
          years: "2013–2016",
          html: `<p><strong>Описание в разработке…</strong></p>`,
          links: [{ text: "Страница VK", url: "https://vk.com/tvorchlich" }],
          gallery: ["/img/h/tvorch.jpg"],
        },
      };

      const bandTitle = document.getElementById("bandTitle");
      const bandYears = document.getElementById("bandYears");
      const bandDescription = document.getElementById("bandDescription");
      const linksBar = document.getElementById("linksBar");
      const gallery = document.getElementById("gallery");

      function renderBand(key) {
        const band = LIB[key];
        bandTitle.textContent = band.title;
        bandYears.textContent = band.years;
        bandDescription.innerHTML = band.html;

        linksBar.innerHTML = band.links
          .map(
            (l) =>
              `<a href="${l.url}" target="_blank" class="btn btn-sm btn-primary">${l.text}</a>`
          )
          .join(" ");

        gallery.innerHTML = band.gallery
          .map(
            (src) => `
          <div class="col-md-4">
            <img src="${src}" alt="${band.title}" />
          </div>`
          )
          .join("");

        document
          .querySelectorAll(".group-btn")
          .forEach((b) => b.classList.toggle("active", b.dataset.band === key));
      }

      document.querySelectorAll(".group-btn").forEach((btn) => {
        btn.addEventListener("click", () => renderBand(btn.dataset.band));
      });

      renderBand("rost");
    </script>
  </body>
</html>
