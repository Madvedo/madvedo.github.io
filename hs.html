<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>История</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --blue-dark: #272a30;
        --blue-dark-2: #212429;
        --paper: #f6f7fb;
      }

      body {
        font-family: "Roboto", system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--paper);
        margin: 0;
        padding-top: 90px;
      }

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }

      .page-wrap {
        padding-bottom: 60px;
      }

      /* Сайдбар */
      .sidebar {
        border-right: 1px solid #e5e7eb;
        min-height: calc(100vh - 140px);
        max-height: 100vh;
        overflow-y: auto;
        padding-right: 5px;
      }
      .group-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--blue-dark);
        color: #fff;
        border: none;
        width: 100%;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.05s ease;
        text-align: left;
      }
      .group-btn:hover {
        background: var(--blue-dark-2);
      }
      .group-btn.active {
        outline: 2px solid rgba(255, 255, 255, 0.35);
      }
      .group-btn img {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        object-fit: cover;
      }

      /* Контент */
      .content h2 {
        font-weight: 700;
        color: var(--blue-dark);
        margin-bottom: 8px;
      }
      .band-years {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 12px;
      }
      .band-description {
        margin-bottom: 16px;
      }
      .gallery img {
        border-radius: 12px;
        object-fit: cover;
        width: 100%;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/">
          <img src="Logo.png" alt="ShUn1" width="40" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="concerts.html">Фотоархив</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="bands.html">Группы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="hs.html">История</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">О проекте</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="radio.html">Радио</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->
    <main class="page-wrap">
      <div class="container">
        <div class="row gx-4">
          <!-- Сайдбар -->
          <aside class="col-lg-3 sidebar">
            <button class="group-btn active" data-band="rost">
              <img src="/img/h/rost.jpg" alt="РОСТ!" />
              <span>РОСТ!</span>
            </button>
            <button class="group-btn" data-band="gvozdi">
              <img src="/img/h/2.jpg" alt="Гвозdи" />
              <span>Гвозdи</span>
            </button>
            <button class="group-btn" data-band="izlom">
              <img src="/img/h/3.jpg" alt="ИЗЛОМ" />
              <span>ИЗЛОМ</span>
            </button>
            <button class="group-btn" data-band="pikap">
              <img src="/img/h/4.jpg" alt="Пикап" />
              <span>Пикап</span>
            </button>
            <button class="group-btn" data-band="schematic">
              <img src="/img/h/5.jpg" alt="Schematic Thing" />
              <span>Schematic Thing</span>
            </button>
            <button class="group-btn" data-band="shahmat">
              <img src="/img/h/6.jpg" alt="Шах и МАТ" />
              <span>Шах и МАТ</span>
            </button>
            <button class="group-btn" data-band="kaktus">
              <img src="/img/h/7.jpg" alt="Кактус" />
              <span>Кактус</span>
            </button>
            <button class="group-btn" data-band="rips">
              <img src="/img/h/8.jpg" alt="R.I.P.S." />
              <span>R.I.P.S.</span>
            </button>
            <button class="group-btn" data-band="klon13">
              <img src="/img/h/9.jpg" alt="klon_13" />
              <span>klon_13</span>
            </button>
            <button class="group-btn" data-band="umeno">
              <img src="/img/h/10.jpg" alt="уменяоно" />
              <span>уменяоно</span>
            </button>
            <button class="group-btn" data-band="f7">
              <img src="/img/h/11.jpg" alt="F7" />
              <span>F7</span>
            </button>
            <button class="group-btn" data-band="fabula">
              <img src="/img/h/12.jpg" alt="Fabula" />
              <span>Fabula</span>
            </button>
            <button class="group-btn" data-band="rimes">
              <img src="/img/h/13.jpg" alt="RIMES" />
              <span>RIMES</span>
            </button>
            <!-- Новые группы -->
            <button class="group-btn" data-band="chernovnik">
              <img src="/img/h/chernovnik.jpg" alt="Черновник" />
              <span>Черновник</span>
            </button>
            <button class="group-btn" data-band="swars">
              <img src="/img/h/swars.jpg" alt="Звездные войны" />
              <span>Звездные войны</span>
            </button>
            <button class="group-btn" data-band="kof">
              <img src="/img/h/kof.jpg" alt="King of Fire" />
              <span>King of Fire</span>
            </button>
            <button class="group-btn" data-band="bagazhnik">
              <img src="/img/h/bagazhnik.jpg" alt="Багажник" />
              <span>Багажник</span>
            </button>
            <button class="group-btn" data-band="tvorch">
              <img src="/img/h/tvorch.jpg" alt="Творческие личности" />
              <span>Творческие личности</span>
            </button>
          </aside>

          <!-- Контент -->
          <section class="col-lg-9 content">
            <h2 id="bandTitle">РОСТ!</h2>
            <div class="band-years" id="bandYears">2006–2018</div>
            <p class="band-description" id="bandDescription">
              Молодая энергичная команда из Шаховской, оставившая яркий след на
              сцене района.
            </p>
            <div class="mb-3" id="linksBar"></div>
            <div class="row g-3 gallery" id="gallery"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const LIB = {
        rost: {
          title: "РОСТ!",
          years: "2006–2018",
          description: "Молодая энергичная команда из Шаховской.",
          links: [{ text: "Страница VK", url: "https://vk.com/club2315280" }],
          gallery: ["/img/h/rost.jpg"],
        },
        gvozdi: {
          title: "Гвозdи",
          years: "2007–2012",
          description: "Одна из ключевых групп района.",
          links: [{ text: "Страница VK", url: "https://vk.com/club10758993" }],
          gallery: ["/img/h/2.jpg"],
        },
        izlom: {
          title: "ИЗЛОМ",
          years: "2008–2013",
          description: "Команда, собравшая вокруг себя верных слушателей.",
          links: [{ text: "Страница VK", url: "https://vk.com/club13535431" }],
          gallery: ["/img/h/3.jpg"],
        },
        pikap: {
          title: "Пикап",
          years: "2007–2011",
          description: "Рок-группа из Шаховской.",
          links: [{ text: "Страница VK", url: "https://vk.com/club5413290" }],
          gallery: ["/img/h/4.jpg"],
        },
        schematic: {
          title: "Schematic Thing",
          years: "2006–2012",
          description: "Альтернативная группа с уникальным стилем.",
          links: [{ text: "Страница VK", url: "https://vk.com/club17764925" }],
          gallery: ["/img/h/5.jpg"],
        },
        shahmat: {
          title: "Шах и МАТ",
          years: "2012–2013",
          description: "Короткая, но яркая история.",
          links: [
            { text: "Страница VK", url: "https://vk.com/public39648696" },
          ],
          gallery: ["/img/h/6.jpg"],
        },
        kaktus: {
          title: "Кактус",
          years: "2009–2012",
          description: "Лёгкий рок и весёлые тексты.",
          links: [
            { text: "Страница VK", url: "https://vk.com/kaktyc_rockband" },
          ],
          gallery: ["/img/h/7.jpg"],
        },
        rips: {
          title: "R.I.P.S.",
          years: "2008–2009",
          description: "Короткая жизнь, но сильная энергия.",
          links: [{ text: "Страница VK", url: "https://vk.com/club6068540" }],
          gallery: ["/img/h/8.jpg"],
        },
        klon13: {
          title: "klon_13",
          years: "2009–2012",
          description: "Эксперименты со звучанием.",
          links: [{ text: "Страница VK", url: "https://vk.com/club20308414" }],
          gallery: ["/img/h/9.jpg"],
        },
        umeno: {
          title: "уменяоно",
          years: "2011–2014",
          description: "Творческая группа с необычным названием.",
          links: [
            { text: "Страница VK", url: "https://vk.com/y_m_o_chernovik" },
          ],
          gallery: ["/img/h/10.jpg"],
        },
        f7: {
          title: "F7",
          years: "2011–2014",
          description: "Рок-группа из Шаховской.",
          links: [{ text: "Страница VK", url: "https://vk.com/f7_group" }],
          gallery: ["/img/h/11.jpg"],
        },
        fabula: {
          title: "Fabula",
          years: "2009–2010",
          description: "Молодая группа, быстро собравшая аудиторию.",
          links: [{ text: "Страница VK", url: "https://vk.com/club14829392" }],
          gallery: ["/img/h/12.jpg"],
        },
        rimes: {
          title: "RIMES",
          years: "2010",
          description: "Короткий проект, оставшийся в памяти.",
          links: [{ text: "Страница VK", url: "https://vk.com/club15093613" }],
          gallery: ["/img/h/13.jpg"],
        },
        // новые
        chernovnik: {
          title: "Черновник",
          years: "2012–2015",
          description: "Андеграундная команда, известная сырым звучанием.",
          links: [{ text: "Страница VK", url: "https://vk.com/chernovnik" }],
          gallery: ["/img/h/chernovnik.jpg"],
        },
        swars: {
          title: "Звездные войны",
          years: "2010–2013",
          description: "Экспериментальная рок-группа.",
          links: [{ text: "Страница VK", url: "https://vk.com/starwarsband" }],
          gallery: ["/img/h/swars.jpg"],
        },
        kof: {
          title: "King of Fire",
          years: "2009–2012",
          description: "Метал-группа с огненным драйвом.",
          links: [{ text: "Страница VK", url: "https://vk.com/kingoffire" }],
          gallery: ["/img/h/kof.jpg"],
        },
        bagazhnik: {
          title: "Багажник",
          years: "2011–2014",
          description: "Юмор, панк и драйв в одном лице.",
          links: [{ text: "Страница VK", url: "https://vk.com/bagazhnik" }],
          gallery: ["/img/h/bagazhnik.jpg"],
        },
        tvorch: {
          title: "Творческие личности",
          years: "2013–2016",
          description: "Объединение музыкантов и поэтов.",
          links: [{ text: "Страница VK", url: "https://vk.com/tvorchlich" }],
          gallery: ["/img/h/tvorch.jpg"],
        },
      };

      const bandTitle = document.getElementById("bandTitle");
      const bandYears = document.getElementById("bandYears");
      const bandDescription = document.getElementById("bandDescription");
      const linksBar = document.getElementById("linksBar");
      const gallery = document.getElementById("gallery");

      function renderBand(key) {
        const band = LIB[key];
        bandTitle.textContent = band.title;
        bandYears.textContent = band.years;
        bandDescription.textContent = band.description;

        linksBar.innerHTML = band.links
          .map(
            (l) =>
              `<a href="${l.url}" target="_blank" class="btn btn-sm btn-primary">${l.text}</a>`
          )
          .join(" ");

        gallery.innerHTML = band.gallery
          .map(
            (src) => `
          <div class="col-md-4">
            <img src="${src}" alt="${band.title}" />
          </div>`
          )
          .join("");

        document
          .querySelectorAll(".group-btn")
          .forEach((b) => b.classList.toggle("active", b.dataset.band === key));
      }

      document.querySelectorAll(".group-btn").forEach((btn) => {
        btn.addEventListener("click", () => renderBand(btn.dataset.band));
      });

      renderBand("rost");
    </script>
  </body>
</html>
