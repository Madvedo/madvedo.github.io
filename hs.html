        const band = LIB[key];
        const isMobile = window.innerWidth < 992;

          document.getElementById("modalBandTitle").textContent = band.title;
          document.getElementById("modalBandYears").textContent = band.years;
          document.getElementById("modalBandDescription").innerHTML = band.html;

            .map(
              (l) =>
                `<a href="${l.url}" target="_blank" class="btn btn-sm btn-primary">${l.text}</a>`
            )
            .join(" ");

            .map(
              (src) =>
                `<div class="col-6"><img src="${src}" alt="${band.title}" /></div>`
            )
            .join("");

            document.getElementById("bandModal")
          );

          bandTitle.textContent = band.title;
          bandYears.textContent = band.years;

            .map(

            .join("");

          .querySelectorAll(".group-btn")
          .forEach((b) => b.classList.toggle("active", b.dataset.band === key));
