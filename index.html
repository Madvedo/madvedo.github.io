    <style>
      :root {
        --header-color: #212529;
        --player-color: #171a1e;
        --player-border: #454c54;
        --player-text: #eef0f2;
        --player-muted: #aeb6bf;
      }

      body {
        margin: 0;
        background: #fff;
      }

      .site-frame {
        display: block;
        width: 100%;
        min-height: calc(100vh - 64px);
        border: 0;
      }

      .mini-radio {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        width: min(100%, 350px);
        margin-left: auto;
        color: var(--player-text);
        font-family: "Courier New", monospace;
      }

      .mini-radio__display,
      .mini-radio__button {
        min-width: 0;
        border: 1px solid var(--player-border);
        border-radius: 0.5rem;
        background: var(--player-color);
        color: inherit;
      }

      .mini-radio__display {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex: 1;
        padding: 0.38rem 0.55rem;
        overflow: hidden;
        text-align: left;
      }

      .mini-radio__led {
        width: 0.48rem;
        height: 0.48rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #6e7781;
        box-shadow: 0 0 5px transparent;
      }

      .mini-radio.is-playing .mini-radio__led {
        background: #79d279;
        box-shadow: 0 0 7px #79d279;
      }

      .mini-radio__track {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 0.75rem;
        line-height: 1.2;
      }

      .mini-radio__time {
        flex: 0 0 auto;
        color: var(--player-muted);
        font-size: 0.72rem;
      }

      .mini-radio__button {
        width: 2rem;
        height: 2rem;
        padding: 0;
        font-weight: bold;
      }

      .mini-radio__display:hover,
      .mini-radio__button:hover,
      .mini-radio__button:focus-visible,
      .mini-radio__track-button:hover,
      .mini-radio__track-button:focus-visible {
        border-color: #9aa4ae;
        color: #fff;
        outline: none;
      }

      .mini-radio__panel {
        position: absolute;
        z-index: 1030;
        top: calc(100% + 0.45rem);
        right: 0;
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--player-border);
        border-radius: 0.5rem;
        background: var(--player-color);
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.45);
      }

      .mini-radio__panel-title {
        padding: 0.5rem 0.65rem;
        border-bottom: 1px solid #343a40;
        color: var(--player-muted);
        font-size: 0.72rem;
      }

      .mini-radio__tracks {
        max-height: 18rem;
        overflow-y: auto;
      }

      .mini-radio__track-button {
        display: block;
        width: 100%;
        padding: 0.45rem 0.65rem;
        border: 0;
        border-bottom: 1px solid #2b3035;
        background: transparent;
        color: var(--player-text);
        text-align: left;
        font: inherit;
        font-size: 0.76rem;
      }

      .mini-radio__track-button.is-active {
        background: #343a40;
        color: #fff;
      }

      @media (max-width: 991.98px) {
        .navbar .mini-radio {
          order: 3;
          width: 100%;
          margin-top: 0.75rem;
        }
      }
    </style>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="#home">
          <img src="/Logo.png" alt="ShUn1" width="40" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Переключить меню"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#news.html">Новости</a></li>
            <li class="nav-item"><a class="nav-link" href="#concerts.html">Фотоархив</a></li>
            <li class="nav-item"><a class="nav-link" href="#bands.html">Группы</a></li>
            <li class="nav-item"><a class="nav-link" href="#hs.html">История</a></li>
            <li class="nav-item"><a class="nav-link" href="#About.html">О проекте</a></li>
          </ul>
        </div>
        <div class="mini-radio" id="miniRadio">
          <button
            class="mini-radio__display"
            id="miniRadioToggle"
            type="button"
            aria-expanded="false"
            aria-controls="miniRadioPanel"
            title="Показать плейлист"
          >
            <span class="mini-radio__led" aria-hidden="true"></span>
            <span class="mini-radio__track" id="miniRadioTrack">Загружаем плейлист…</span>
            <span class="mini-radio__time" id="miniRadioTime">0:00</span>
          </button>
          <button
            class="mini-radio__button"
            id="miniRadioPlay"
            type="button"
            aria-label="Воспроизвести"
            title="Воспроизвести"
          >▶</button>
          <div class="mini-radio__panel" id="miniRadioPanel" hidden>
            <div class="mini-radio__panel-title">ШАХОВСКОЕ ПОДПОЛЬЕ · РАДИО</div>
            <div class="mini-radio__tracks" id="miniRadioTracks"></div>
          </div>
          <audio id="miniRadioAudio" preload="metadata"></audio>
        </div>
      </div>

    <iframe class="site-frame" id="siteFrame" name="siteFrame" title="Содержание сайта"></iframe>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        const player = document.getElementById("miniRadio");
        const audio = document.getElementById("miniRadioAudio");
        const toggle = document.getElementById("miniRadioToggle");
        const playButton = document.getElementById("miniRadioPlay");
        const panel = document.getElementById("miniRadioPanel");
        const trackLabel = document.getElementById("miniRadioTrack");
        const timeLabel = document.getElementById("miniRadioTime");
        const tracksList = document.getElementById("miniRadioTracks");
        let tracks = [];
        let currentIndex = -1;

        const formatTime = (seconds) => {
          if (!Number.isFinite(seconds)) return "0:00";
          return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
        };
        const trackName = (path) => path.split("/").pop().replace(/\.[^/.]+$/, "");

        function renderTrackList() {
          tracksList.replaceChildren(...tracks.map((track, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "mini-radio__track-button";
            button.textContent = trackName(track);
            button.dataset.index = String(index);
            button.setAttribute("aria-label", `Воспроизвести: ${trackName(track)}`);
            button.addEventListener("click", () => selectTrack(index, true));
            return button;
          }));
        }

        function markCurrentTrack() {
          tracksList.querySelectorAll("[data-index]").forEach((button) => {
            button.classList.toggle("is-active", Number(button.dataset.index) === currentIndex);
          });
        }

        function selectTrack(index, shouldPlay) {
          if (!tracks[index]) return;
          currentIndex = index;
          audio.src = encodeURI(tracks[index]);
          trackLabel.textContent = trackName(tracks[index]);
          timeLabel.textContent = "0:00";
          markCurrentTrack();
          if (shouldPlay) audio.play().catch(updatePlaybackState);
        }

        function updatePlaybackState() {
          const isPlaying = !audio.paused;
          player.classList.toggle("is-playing", isPlaying);
          playButton.textContent = isPlaying ? "❚❚" : "▶";
          playButton.setAttribute("aria-label", isPlaying ? "Поставить на паузу" : "Воспроизвести");
          playButton.title = playButton.getAttribute("aria-label");
        }

        function setPanelVisibility(isVisible) {
          panel.hidden = !isVisible;
          toggle.setAttribute("aria-expanded", String(isVisible));
        }

        async function loadTracks() {
          try {
            const response = await fetch("/tracks.json", { cache: "no-cache" });
            const playlist = await response.json();
            if (!response.ok || !Array.isArray(playlist) || playlist.length === 0) throw new Error("playlist unavailable");
            tracks = playlist;
            renderTrackList();
            selectTrack(Math.floor(Math.random() * tracks.length), false);
          } catch {
            trackLabel.textContent = "Плейлист недоступен";
            playButton.disabled = true;
            toggle.disabled = true;
          }
        }

        toggle.addEventListener("click", () => setPanelVisibility(panel.hidden));
        playButton.addEventListener("click", () => {
          if (currentIndex < 0) return;
          if (audio.paused) audio.play().catch(updatePlaybackState);
          else audio.pause();
        });
        audio.addEventListener("play", updatePlaybackState);
        audio.addEventListener("pause", updatePlaybackState);
        audio.addEventListener("timeupdate", () => { timeLabel.textContent = formatTime(audio.currentTime); });
        audio.addEventListener("ended", () => selectTrack((currentIndex + 1) % tracks.length, true));
        audio.addEventListener("error", () => { trackLabel.textContent = "Не удалось загрузить трек"; updatePlaybackState(); });
        document.addEventListener("click", (event) => { if (!player.contains(event.target)) setPanelVisibility(false); });
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") setPanelVisibility(false); });
        window.addEventListener("message", (event) => {
          if (event.origin === window.location.origin && event.data?.type === "shunder:band-audio-play") audio.pause();
        });
        loadTracks();
      })();
    </script>
    <script>
      (() => {
        const frame = document.getElementById("siteFrame");
        const routes = new Set(["home", "news.html", "concerts.html", "bands.html", "hs.html", "About.html", "radio.html"]);
        const routeToPath = (route) => route === "home" ? "/home.html" : `/${route}`;

        function loadRoute() {
          const requested = decodeURIComponent(window.location.hash.slice(1) || "home");
          const route = routes.has(requested) ? requested : "home";
          if (route !== requested) window.location.hash = route;
          const path = routeToPath(route);
          if (frame.getAttribute("src") !== path) frame.setAttribute("src", path);
        }

        window.addEventListener("hashchange", loadRoute);
        window.addEventListener("message", (event) => {
          if (event.origin !== window.location.origin || !event.data) return;
          if (event.data.type === "shunder:page-height") {
            frame.style.height = `${Math.max(560, event.data.height)}px`;
          }
          if (event.data.type === "shunder:page-title") document.title = event.data.title;
        });
        loadRoute();
      })();
    </script>
