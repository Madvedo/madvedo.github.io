<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подполье</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />

    <!-- Иконки -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Стили -->
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <style>
      .rounded-img {
        width: 60%;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        padding: 0.6em;
        margin-bottom: 1em;
      }
      .center {
        margin-left: 100px;
      }
      #parent {
        position: relative;
        height: 300px;
      }
      #child {
        position: absolute;
        bottom: 0;
        margin-left: 5px;
        height: 100px;
        width: 100px;
      }
      a {
        text-decoration: none;
        color: black;
      }
    </style>

    <!-- Keycloak -->
    <script src="https://artemtest.goodt.me/keycloak/js/keycloak.js"></script>
  </head>
  <body>
    <!-- Модальное окно -->
    <div class="modal fade" id="welcomeModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добро пожаловать!</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Закрыть"
            ></button>
          </div>
          <div class="modal-body">Вы вошли на портал.</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/">
          <img src="Logo.png" alt="ShUn1" width="40" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Переключить меню"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="concerts.html">Фотоархив</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="bands.html">Группы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="hs.html">История</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">О проекте</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Контент -->
    <div class="container text-center">
      <div class="row">
        <div class="col-lg-6 col-md-8 mx-auto">
          <h1 class="fw-light">ШАХОВСКОЕ ПОДПОЛЬЕ</h1>
          <h2>Творческий мир на задворках <br />Московской области</h2>

          <a href="https://vk.com/shah_underground" target="_blank">
            <img class="rounded-img" src="1.jpg" alt="ShUn" />
          </a>

          <div class="container my-5">
            <a href="/music.html" target="_blank" class="btn btn-secondary"
              >Аудио</a
            >
            <a
              href="https://vk.com/video/@shah_underground"
              target="_blank"
              class="btn btn-secondary"
              >Видео</a
            >
            <p class="lead my-5 text-muted">
              История, которая пишется сейчас. <br />
              Дата создания сообщества — 11.10.2010. <br />
              Добро пожаловать!
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Подвал -->
    <footer>
      <div class="container text-center">
        <a href="https://vk.com/b1gbearrr" target="_blank">
          <h4>Madvedo Airbow &copy;</h4>
        </a>
      </div>
    </footer>

    <!-- Скрипты -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>

    <script>
      const keycloak = Keycloak({
        url: "https://artemtest.goodt.me/keycloak/",
        realm: "shah-underground",
        clientId: "shahunder",
      });

      keycloak
        .init({ onLoad: "login-required", checkLoginIframe: false })
        .then((authenticated) => {
          if (authenticated) {
            console.log("Пользователь авторизован");

            const lastShownDate = localStorage.getItem("welcomeLastShown");
            const today = new Date().toDateString();

            if (!lastShownDate || lastShownDate !== today) {
              const welcomeModal = new bootstrap.Modal(
                document.getElementById("welcomeModal")
              );
              welcomeModal.show();
              localStorage.setItem("welcomeLastShown", today);
            }
          } else {
            console.warn("Не авторизован");
          }
        })
        .catch((error) => {
          console.error("Ошибка инициализации Keycloak:", error);
        });
    </script>
  </body>
</html>
