    <style>
      :root {
        --header-color: #212529;
        --player-color: #171a1e;
        --player-border: #454c54;
        --player-text: #eef0f2;
        --player-muted: #aeb6bf;
      }

      body {
        margin: 0;
        background: transparent;
      }

      .site-frame {
        display: block;
        width: 100%;
        min-height: 0;
        border: 0;
        background: transparent;
        opacity: 0;
        transition: opacity .18s ease;
      }
      .site-frame.is-loaded { opacity: 1; }

      .mini-radio {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        width: min(100%, 350px);
        margin-left: auto;
        color: var(--player-text);
        font-family: "Courier New", monospace;
      }

      .mini-radio__display,
      .mini-radio__button {
        min-width: 0;
        border: 1px solid var(--player-border);
        border-radius: 0.5rem;
        background: var(--player-color);
        color: inherit;
      }

      .mini-radio__display {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex: 1;
        padding: 0.38rem 0.55rem;
        overflow: hidden;
        text-align: left;
      }

      .mini-radio__led {
        width: 0.48rem;
        height: 0.48rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #6e7781;
        box-shadow: 0 0 5px transparent;
      }

      .mini-radio.is-playing .mini-radio__led {
        background: #79d279;
        box-shadow: 0 0 7px #79d279;
      }

      .mini-radio__track {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 0.75rem;
        line-height: 1.2;
      }

      .mini-radio__time {
        flex: 0 0 auto;
        color: var(--player-muted);
        font-size: 0.72rem;
      }

      .mini-radio__button {
        width: 2rem;
        height: 2rem;
        padding: 0;
        font-weight: bold;
      }

      .mini-radio__display:hover,
      .mini-radio__button:hover,
      .mini-radio__button:focus-visible,
      .mini-radio__track-button:hover,
      .mini-radio__track-button:focus-visible {
        border-color: #9aa4ae;
        color: #fff;
        outline: none;
      }

      .mini-radio__status { margin-left: auto; color: var(--player-muted); font-size: .68rem; }
      .mini-radio.is-playing .mini-radio__status { color: #79d279; }
      .mini-radio__shuffle { display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.75rem; line-height:.62rem; }

      @media (max-width: 991.98px) {
        .navbar .container {
          padding-top: 0.35rem;
          padding-bottom: 0.35rem;
        }

        .navbar .mini-radio {
          order: 3;
          width: 100%;
          margin-top: 0.4rem;
          margin-left: 0;
        }

        .mini-radio__panel {
          position: fixed;
          top: auto;
          right: 0.75rem;
          left: 0.75rem;
          width: auto;
          max-height: min(55vh, 26rem);
        }

        .mini-radio__tracks {
          max-height: min(45vh, 20rem);
        }
      }
    </style>

            id="miniRadioShuffle"
            type="button"
            aria-label="Сменить трек"
            title="Сменить трек"
            class="mini-radio__button mini-radio__shuffle"

    <iframe class="site-frame" id="siteFrame" name="siteFrame" title="Содержание сайта" scrolling="auto" allowtransparency="true"></iframe>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        const player = document.getElementById("miniRadio");
        const audio = document.getElementById("miniRadioAudio");
        const toggle = document.getElementById("miniRadioToggle");
        const shuffleButton = document.getElementById("miniRadioShuffle");
        const trackLabel = document.getElementById("miniRadioTrack");
        const statusLabel = document.getElementById("miniRadioStatus");
        let tracks = [];
        let currentIndex = -1;
        const trackName = (path) => path.split("/").pop().replace(/\.[^/.]+$/, "");
        function selectTrack(index) {
          if (!tracks[index]) return;
          currentIndex = index;
          audio.src = encodeURI(tracks[index]);
          trackLabel.textContent = trackName(tracks[index]);
          statusLabel.textContent = "загрузка";
          audio.play().catch(() => { statusLabel.textContent = "нажмите ещё раз"; updatePlaybackState(); });
        }
        function randomTrack() {
          if (!tracks.length) return;
          let next = Math.floor(Math.random() * tracks.length);
          if (tracks.length > 1 && next === currentIndex) next = (next + 1) % tracks.length;
          selectTrack(next);
        }

        function updatePlaybackState() {
          const isPlaying = !audio.paused;
          player.classList.toggle("is-playing", isPlaying);
          statusLabel.textContent = isPlaying ? "играет" : (currentIndex < 0 ? "готово" : "пауза");
          toggle.title = isPlaying ? "Остановить воспроизведение" : "Продолжить воспроизведение";
        }

        async function loadTracks() {
          try {
            const response = await fetch("/tracks.json", { cache: "no-cache" });
            const playlist = await response.json();
            if (!response.ok || !Array.isArray(playlist) || playlist.length === 0) throw new Error("playlist unavailable");
            tracks = playlist;
            trackLabel.textContent = "Слушать радио";
            statusLabel.textContent = "готово";
          } catch {
            trackLabel.textContent = "Плейлист недоступен";
            shuffleButton.disabled = true;
            toggle.disabled = true;
          }
        }

        toggle.addEventListener("click", () => {
          if (currentIndex < 0) randomTrack();
          else if (audio.paused) audio.play().catch(updatePlaybackState);
          else audio.pause();
        });
        shuffleButton.addEventListener("click", randomTrack);
        audio.addEventListener("play", () => {
          updatePlaybackState();
          document.getElementById("siteFrame")?.contentWindow?.postMessage(
            { type: "shunder:radio-play" },
            window.location.origin
          );
        });
        audio.addEventListener("pause", updatePlaybackState);
        audio.addEventListener("ended", randomTrack);
        audio.addEventListener("error", () => { trackLabel.textContent = "Не удалось загрузить трек"; updatePlaybackState(); });
        window.addEventListener("message", (event) => {
          if (event.origin === window.location.origin && event.data?.type === "shunder:band-audio-play") audio.pause();
        });
        loadTracks();
      })();
    </script>
    <script>
      (() => {
        const frame = document.getElementById("siteFrame");
        const header = document.querySelector("nav");
        const routes = new Set(["home", "news.html", "concerts.html", "bands.html", "hs.html", "About.html", "radio.html"]);
        const routeToPath = (route) => route === "home" ? "/home.html" : `/${route}`;

        function loadRoute() {
          const requested = decodeURIComponent(window.location.hash.slice(1) || "home");
          const route = routes.has(requested) ? requested : "home";
          if (route !== requested) window.location.hash = route;
          const path = routeToPath(route);
          if (frame.getAttribute("src") !== path) { frame.classList.remove("is-loaded"); frame.setAttribute("src", path); }
        }

        window.addEventListener("hashchange", loadRoute);
        frame.addEventListener("load", () => requestAnimationFrame(() => frame.classList.add("is-loaded")));
        function fitFrame() {
          frame.style.height = `${Math.max(220, window.innerHeight - header.offsetHeight)}px`;
        }
        window.addEventListener("resize", fitFrame);
        new ResizeObserver(fitFrame).observe(header);
        window.addEventListener("message", (event) => {
          if (event.origin !== window.location.origin || !event.data) return;
          if (event.data.type === "shunder:page-title") document.title = event.data.title;
        });
        fitFrame();
        loadRoute();
      })();
    </script>
