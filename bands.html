<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Группы</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --blue-dark: #272a30; /* главный тёмно-синий */
        --blue-dark-2: #4b525e; /* hover */
        --blue-soft: #445577; /* вспомогательный */
        --accent: #0d6efd; /* акцент прогресса/иконок */
        --paper: #f6f7fb; /* светлый фон */
      }

      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Roboto", system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--paper);
        color: #1d1e22;
        margin: 0;
        padding: 0;
      }

      /* Navbar — классическая чёрная */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }
      .page-wrap {
        padding-top: 90px; /* отступ от шапки */
        padding-bottom: 140px; /* место для плеера */
      }

      /* Сайдбар групп */
      .sidebar {
        border-right: 1px solid #e5e7eb;
        min-height: calc(100vh - 230px);
      }
      .group-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--blue-dark);
        color: #fff;
        border: none;
        width: 100%;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.05s ease;
        text-align: left;
      }
      .group-btn:hover {
        background: var(--blue-dark-2);
      }
      .group-btn:active {
        transform: translateY(1px);
      }
      .group-btn img {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .group-btn.active {
        outline: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 6px 22px rgba(43, 60, 91, 0.28);
      }

      /* Правая колонка */
      .content h2 {
        font-weight: 700;
        color: var(--blue-dark);
        margin-bottom: 16px;
      }
      .link-bar .btn {
        margin-right: 8px;
        margin-bottom: 10px;
      }

      /* Аккордеон альбомов */
      .accordion .accordion-item {
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 6px 18px rgba(43, 60, 91, 0.1);
        background: #fff;
        margin-bottom: 14px;
      }
      .accordion-button {
        background: var(--blue-dark);
        color: #fff;
        font-weight: 600;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .accordion-button:not(.collapsed) {
        background: var(--blue-dark-2);
        color: #fff;
      }
      .accordion-button:focus {
        box-shadow: none;
      }
      .album-body {
        background: #fff;
        padding: 14px 16px 18px 16px;
      }

      /* Обложка + треклист внутри альбома */
      .album-cover {
        width: 120px;
        height: 120px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(43, 60, 91, 0.25);
      }
      .track {
        padding: 9px 12px;
        border-radius: 10px;
        transition: background 0.15s ease;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .track:hover {
        background: #f1f3f7;
      }
      .track small {
        color: #6b7280;
      }

      /* Единый плеер (фикс снизу) */
      .player {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background: var(--blue-dark);
        color: #fff;
        z-index: 1100;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35);
      }
      .player-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px 12px 18px;
      }
      .p-cover {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        background: #1b2538;
      }
      .p-meta {
        flex: 1;
        min-width: 0;
      }
      .p-title {
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .p-artist {
        font-size: 14px;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .p-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .p-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #1f2d45;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.15s ease;
        font-size: 18px;
      }
      .p-btn:hover {
        background: #263553;
      }
      .p-btn:active {
        transform: translateY(1px);
      }
      .p-btn.play {
        width: 50px;
        height: 50px;
        font-size: 20px;
        background: #223150;
      }
      .p-btn.play:hover {
        background: #2a3b5f;
      }

      .p-times {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.9;
        margin: -6px 2px 4px;
      }
      .p-progress-wrap {
        width: 100%;
        height: 8px;
        background: #1f2b42;
        border-radius: 999px;
        overflow: hidden;
        cursor: pointer;
      }
      .p-progress {
        height: 100%;
        width: 0%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(13, 110, 253, 0.65) inset;
      }

      /* Маленькие экраны */
      @media (max-width: 991px) {
        .sidebar {
          margin-bottom: 14px;
          border-right: none;
        }
        .player-inner {
          gap: 12px;
        }
        .p-meta {
          min-width: 180px;
        }
        .p-btn {
          width: 38px;
          height: 38px;
        }
        .p-btn.play {
          width: 46px;
          height: 46px;
        }
      }
    </style>
  </head>
  <body>

    <!-- CONTENT -->

    </main>

    <!-- ЕДИНЫЙ ПЛЕЕР -->
    <div class="player">
      <div class="player-inner container">
        <img class="p-cover" id="pCover" src="/b/a/1.jpg" alt="cover" />
        <div class="p-meta">
          <div class="p-title" id="pTitle">Ничего не играет</div>
          <div class="p-artist" id="pArtist"></div>
          <div class="p-times">
            <span id="pCur">0:00</span>
            <span id="pDur">0:00</span>
          </div>
          <div class="p-progress-wrap" id="progressWrap">
            <div class="p-progress" id="progressBar"></div>
          </div>
        </div>
        <div class="p-controls">
          <button class="p-btn" id="prevBtn" title="Предыдущий">⏮</button>
          <button class="p-btn play" id="playBtn" title="Воспроизвести">
            ▶

          <button class="p-btn" id="nextBtn" title="Следующий">⏭</button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JS -->
    <script>
      /* ДАННЫЕ */

            {

              cls: "btn-primary",
            },
            {
              text: "VK Аудио",
              url: "https://vk.com/audios-60370527",
              cls: "btn-outline-primary",
            },
          ],
          albums: [
            {

              tracks: [

              tracks: [

                },

              ],
            },
            {

              cover: "img/nl.png",
              tracks: [
                { title: "Самый Умный", src: "/audio/1. Самый Умный.wav" },
                {
                  title: "Подрежь Мне Крылья",
                  src: "/audio/2. Подрежь Мне Крылья.wav",
                },
                { title: "Руины", src: "/audio/3. Руины.wav" },
                {
                  title: "Покажи Мне Войну По Ящику",
                  src: "/audio/4. Покажи Мне Войну По Ящику.wav",
                },
                { title: "Дед", src: "/audio/5. Дед.wav" },
                { title: "Л. и О.", src: "/audio/6. Л. и О..wav" },
                { title: "Цирк Уродов", src: "/audio/7. Цирк Уродов.wav" },
                { title: "Съебнуть", src: "/audio/8. Съебнуть.wav" },
                { title: "Алиса", src: "/audio/9. Алиса.wav" },
              ],
            },
          ],
        },
        goreot: {
          title: "Горе От",
          cover: "/img/Gore Ot (Logo black).png",
          links: [
            {
              text: "Страница VK",
              url: "https://vk.com/goreot21",
              cls: "btn-primary",
            },
            {
              text: "Promo 'Лишь шанс'",
              url: "https://goreotls.netlify.app",
              cls: "btn-secondary",
            },
            {
              text: "Promo 'Зима была холодной'",
              url: "https://goreot.netlify.app",
              cls: "btn-secondary",
            },
          ],
          albums: [
            {
              title: "2022 – Зима была холодной [Single]",
              cover: "/img/zbh.jpg",
              tracks: [
                {
                  title: "Зима была холодной",
                  src: "/audio/Горе От - Зима была холодной.wav",
                },
                {
                  title: "Ветер",
                  src: "/audio/Горе От - Ветер.wav",
                },
                {
                  title: "Жизнь",
                  src: "/audio/Горе От - Жизнь.wav",
                },
              ],
            },
            {
              title: "2025 – Лишь шанс [EP]",
              cover: "/img/ls.png",
              tracks: [
                {
                  title: "Лишь шанс",
                  src: "/audio/Горе От - Лишь шанс.wav",
                },
              ],
            },
          ],
        },
      };

      /* UI ELEMENTS */
      const bandTitle = document.getElementById("bandTitle");
      const albumsWrap = document.getElementById("albumsWrap");
      const linksBar = document.getElementById("linksBar");

      const audio = document.getElementById("audio");
      const pCover = document.getElementById("pCover");
      const pTitle = document.getElementById("pTitle");
      const pArtist = document.getElementById("pArtist");
      const pCur = document.getElementById("pCur");
      const pDur = document.getElementById("pDur");
      const progressWrap = document.getElementById("progressWrap");
      const progressBar = document.getElementById("progressBar");
      const prevBtn = document.getElementById("prevBtn");
      const playBtn = document.getElementById("playBtn");
      const nextBtn = document.getElementById("nextBtn");

      /* STATE */
      let currentBandKey = "graydawn";
      let currentAlbumIndex = 0;
      let currentTrackIndex = 0;

      function mmss(sec) {
        if (!isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? "0" + s : s}`;
      }

      function renderBand(bandKey) {
        currentBandKey = bandKey;
        const band = LIB[bandKey];
        bandTitle.textContent = band.title;

        // активная кнопка слева
        document.querySelectorAll(".group-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.band === bandKey);
        });

        // ссылки
        linksBar.innerHTML = "";
        if (Array.isArray(band.links)) {
          band.links.forEach((l) => {
            const a = document.createElement("a");
            a.href = l.url;
            a.target = "_blank";
            a.className = `btn ${l.cls} btn-sm`;
            a.textContent = l.text;
            linksBar.appendChild(a);
          });
        }

        // аккордеон альбомов
        albumsWrap.innerHTML = "";
        band.albums.forEach((album, idx) => {
          const accId = `acc-${bandKey}-${idx}`;
          const headId = `head-${bandKey}-${idx}`;
          const collapseId = `collapse-${bandKey}-${idx}`;
          const item = document.createElement("div");
          item.className = "accordion-item";
          item.innerHTML = `
    <h2 class="accordion-header" id="${headId}">
      <button class="accordion-button collapsed" type="button"
        data-bs-toggle="collapse" data-bs-target="#${collapseId}" 
        aria-expanded="false" aria-controls="${collapseId}">
        ${album.title}
      </button>
    </h2>
    <div id="${collapseId}" class="accordion-collapse collapse" 
         aria-labelledby="${headId}" data-bs-parent="#albumsWrap">
      <div class="accordion-body album-body">
        <div class="row g-3 align-items-start">
          <div class="col-auto">
            <img class="album-cover" src="${album.cover}" alt="cover ${
            album.title
          }">
          </div>
          <div class="col">
            <div class="list-group list-group-flush">
              ${album.tracks
                .map(
                  (t, ti) => `
                <div class="list-group-item track d-flex justify-content-between align-items-center"
                     data-band="${bandKey}" data-album-index="${idx}" data-track-index="${ti}">
                  <span>${t.title}</span>
                  <small>▶</small>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
          albumsWrap.appendChild(item);
        });

        // навесить клики на треки
        albumsWrap.querySelectorAll(".track").forEach((el) => {
          el.addEventListener("click", () => {
            const bKey = el.getAttribute("data-band");
            const aIdx = +el.getAttribute("data-album-index");
            const tIdx = +el.getAttribute("data-track-index");
            playFrom(bKey, aIdx, tIdx);
          });
        });

        // сбросить/обновить плейер под выбранную группу
        if (band.albums?.length) {
          currentAlbumIndex = 0;
          currentTrackIndex = 0;
          const firstTrack = band.albums[0].tracks[0];
          pCover.src = band.albums[0].cover || band.cover;
          pArtist.textContent = band.title;
          pTitle.textContent = firstTrack
            ? firstTrack.title
            : "Ничего не играет";
          audio.src = firstTrack ? firstTrack.src : "";
          playBtn.textContent = "▶";
        }
      }

      function playFrom(bandKey, albumIndex, trackIndex) {
        currentBandKey = bandKey;
        currentAlbumIndex = albumIndex;
        currentTrackIndex = trackIndex;
        const band = LIB[bandKey];
        const album = band.albums[albumIndex];
        const track = album.tracks[trackIndex];

        audio.src = track.src;
        audio.play().catch(() => {
          /* autoplay guard */
        });

        pCover.src = album.cover || band.cover;
        pArtist.textContent = band.title;
        pTitle.textContent = track.title;
        playBtn.textContent = "⏸";
      }

      function nextTrack() {
        const band = LIB[currentBandKey];
        const album = band.albums[currentAlbumIndex];
        currentTrackIndex = (currentTrackIndex + 1) % album.tracks.length;
        playFrom(currentBandKey, currentAlbumIndex, currentTrackIndex);
      }
      function prevTrack() {
        const band = LIB[currentBandKey];
        const album = band.albums[currentAlbumIndex];
        currentTrackIndex =
          (currentTrackIndex - 1 + album.tracks.length) % album.tracks.length;
        playFrom(currentBandKey, currentAlbumIndex, currentTrackIndex);
      }
      function togglePlay() {
        if (audio.paused) {
          audio.play();
          playBtn.textContent = "⏸";
        } else {
          audio.pause();
          playBtn.textContent = "▶";
        }
      }

      // Прогресс-бар и время
      audio.addEventListener("timeupdate", () => {
        const { currentTime, duration } = audio;
        pCur.textContent = mmss(currentTime);
        pDur.textContent = mmss(duration);
        const pct = duration ? (currentTime / duration) * 100 : 0;
        progressBar.style.width = pct + "%";
      });
      audio.addEventListener("ended", nextTrack);

      progressWrap.addEventListener("click", (e) => {
        const rect = progressWrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = x / rect.width;
        audio.currentTime = ratio * (audio.duration || 0);
      });

      prevBtn.addEventListener("click", prevTrack);
      nextBtn.addEventListener("click", nextTrack);
      playBtn.addEventListener("click", togglePlay);

      // Смена группы (сайдбар)
      document.querySelectorAll(".group-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-band");
          renderBand(key);
        });
      });

      // Старт: показываем Gray Dawn
      renderBand("graydawn");
    </script>
  </body>
</html>
