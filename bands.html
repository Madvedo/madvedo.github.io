      :root {
        --blue-dark: #272a30;
        --blue-dark-2: #4b525e;
        --blue-soft: #445577;
        --accent: #0d6efd;
        --paper: #f6f7fb;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Roboto", system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--paper);
        color: #1d1e22;
        margin: 0;
        padding: 0;
      }

      /* NAVBAR */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }
      .page-wrap {
        padding-top: 90px;
        padding-bottom: 140px;
      }
      body.in-shell .page-wrap {
        padding-top: 28px;
      }

      /* SIDEBAR */
      .sidebar {
        border-right: 1px solid #e5e7eb;
        min-height: calc(100vh - 230px);
      }
      .group-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--blue-dark);
        color: #fff;
        border: none;
        width: 100%;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.05s ease;
        text-align: left;
      }
      .group-btn:hover {
        background: var(--blue-dark-2);
      }
      .group-btn:active {
        transform: translateY(1px);
      }
      .group-btn img {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .group-btn.active {
        outline: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 6px 22px rgba(43, 60, 91, 0.28);
      }

      /* CONTENT RIGHT */
      .content h2 {
        font-weight: 700;
        color: var(--blue-dark);
        margin-bottom: 16px;
      }
      .link-bar .btn {
        margin-right: 8px;
        margin-bottom: 10px;
      }

      /* ALBUMS */
      .accordion .accordion-item {
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 6px 18px rgba(43, 60, 91, 0.1);
        background: #fff;
        margin-bottom: 14px;
      }
      .accordion-button {
        background: var(--blue-dark);
        color: #fff;
        font-weight: 600;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .accordion-button:not(.collapsed) {
        background: var(--blue-dark-2);
        color: #fff;
      }
      .accordion-button:focus {
        box-shadow: none;
      }
      .album-body {
        background: #fff;
        padding: 14px 16px 18px;
      }

      .album-cover {
        width: 120px;
        height: 120px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(43, 60, 91, 0.25);
      }
      .track {
        padding: 9px 12px;
        border-radius: 10px;
        transition: background 0.15s ease;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .track:hover {
        background: #f1f3f7;
      }
      .track small {
        color: #6b7280;
      }
      .track { cursor:pointer; }
      .track-inline-toggle { border:0; background:transparent; color:inherit; width:28px; padding:0; font-size:13px; }

      /* PLAYER */
      .player {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background: var(--blue-dark);
        color: #fff;
        z-index: 1100;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35);
      }
      .player-inner {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px 12px;
      }
      .p-cover {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        background: #1b2538;
      }
      .p-meta {
        flex: 1;
        min-width: 0;
      }
      .p-title {
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .p-artist {
        font-size: 14px;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .p-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .p-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #1f2d45;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.15s ease;
        font-size: 18px;
      }
      .p-btn:hover {
        background: #263553;
      }
      .p-btn:active {
        transform: translateY(1px);
      }
      .p-btn.play {
        width: 50px;
        height: 50px;
        font-size: 20px;
        background: #223150;
      }
      .p-btn.play:hover {
        background: #2a3b5f;
      }

      .p-times {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.9;
        margin: -6px 2px 4px;
      }
      .p-progress-wrap {
        width: 100%;
        height: 8px;
        background: #1f2b42;
        border-radius: 999px;
        overflow: hidden;
        cursor: pointer;
      }
      .p-progress {
        height: 100%;
        width: 0%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(13, 110, 253, 0.65) inset;
      }

      /* Mobile */
      @media (max-width: 991px) {
        body.in-shell .page-wrap {
          padding: 12px 12px calc(94px + env(safe-area-inset-bottom));
        }
        .sidebar {
          display: grid;

          min-height: 0;
          margin-bottom: 14px;
          border-right: none;

          font-size: 0.9rem;
        }
        .group-btn img {

          height: 36px;
        }
        .player {
          padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        .player-inner {
          gap: 8px;
          padding: 0 12px;
        }
        .p-meta {
          min-width: 0;
        }
        .p-artist { display: none; }
        .p-title { font-size: 0.86rem; }
        .p-times { margin: -4px 1px 3px; }
        .p-progress-wrap { height: 7px; }
        .p-controls { gap: 5px; }
        .p-btn {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
        .p-btn.play {
          width: 40px;
          height: 40px;
          font-size: 17px;
        }
        /* на мобилке правая колонка скрыта, используем модалку */
        .content {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .sidebar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .p-btn:not(.play) { display: none; }
      }

      function enableLeveling() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return Promise.resolve();
        if (!audioContext) {
          audioContext = new AudioContext();
          const source = audioContext.createMediaElementSource(audio);
          const compressor = audioContext.createDynamicsCompressor();
          const makeup = audioContext.createGain();
          const limiter = audioContext.createDynamicsCompressor();
          compressor.threshold.value = -24;
          compressor.knee.value = 24;
          compressor.ratio.value = 4;
          compressor.attack.value = 0.01;
          compressor.release.value = 0.3;
          makeup.gain.value = 1.15;
          limiter.threshold.value = -3;
          limiter.knee.value = 0;
          limiter.ratio.value = 20;
          limiter.attack.value = 0.003;
          limiter.release.value = 0.12;
          source.connect(compressor).connect(makeup).connect(limiter).connect(audioContext.destination);
        }
        return audioContext.state === "suspended" ? audioContext.resume() : Promise.resolve();
      }

      function mmss(sec) {
        if (!isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? "0" + s : s}`;
      }

      function getContainers(target) {

            titleEl: bandTitleModal,
            linksEl: linksBarModal,
            albumsEl: albumsWrapModal,
            parentId: "albumsWrapModal",
            suffix: "m",
          };
        }
        return {
          titleEl: bandTitle,
          linksEl: linksBar,
          albumsEl: albumsWrap,
          parentId: "albumsWrap",
          suffix: "d",
        };
      }

        currentBandKey = bandKey;
        const band = LIB[bandKey];

        // активная кнопка слева
        document.querySelectorAll(".group-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.band === bandKey);
        });

        // Заголовок + ссылки
        titleEl.textContent = band.title;
        linksEl.innerHTML = "";
        (band.links || []).forEach((l) => {
          const a = document.createElement("a");
          a.href = l.url;
          a.target = "_blank";
          a.className = `btn ${l.cls} btn-sm`;
          a.textContent = l.text;
          linksEl.appendChild(a);
        });

        // Альбомы
        albumsEl.innerHTML = "";
        (band.albums || []).forEach((album, idx) => {

          const collapseId = `collapse-${bandKey}-${idx}-${suffix}`;

                      data-bs-toggle="collapse" data-bs-target="#${collapseId}"
                      aria-expanded="false" aria-controls="${collapseId}">
                      ${album.title}
                    </button>
                  </h2>
                  <div id="${collapseId}" class="accordion-collapse collapse"
                       aria-labelledby="${headId}" data-bs-parent="#${parentId}">
                    <div class="accordion-body album-body">
                      <div class="row g-3 align-items-start">
                        <div class="col-auto">
                          <img class="album-cover" src="${
                            album.cover
                          }" alt="cover ${album.title}">
                        </div>
                        <div class="col">
                          <div class="list-group list-group-flush">
                            ${album.tracks
                              .map(
                                (t, ti) => `
                                <div class="list-group-item track d-flex justify-content-between align-items-center"
                                     data-band="${bandKey}" data-album-index="${idx}" data-track-index="${ti}">
                                  <span>${t.title}</span>
                                  <button class="track-inline-toggle" type="button" title="Воспроизвести">▶</button>
                                </div>
                              `
                              )
                              .join("")}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>`;
          albumsEl.appendChild(item);
        });

        // События по трекам в выбранном контейнере
        albumsEl.querySelectorAll(".track").forEach((el) => {
          el.addEventListener("click", () => {
            const bKey = el.getAttribute("data-band");
            const aIdx = +el.getAttribute("data-album-index");
            const tIdx = +el.getAttribute("data-track-index");
            if (bKey === currentBandKey && aIdx === currentAlbumIndex && tIdx === currentTrackIndex && audio.src) {
              audio.paused ? audio.play() : audio.pause();
            } else {
              playFrom(bKey, aIdx, tIdx);
            }
          });
        });

        // Обновить плеер для группы (первый трек)
        // Обновлять плеер только если он ещё пустой
        if (!audio.src) {
          if (band.albums?.length) {
            currentAlbumIndex = 0;
            currentTrackIndex = 0;
            const firstTrack = band.albums[0].tracks[0];
            pCover.src = band.albums[0].cover || band.cover;
            pArtist.textContent = band.title;
            pTitle.textContent = firstTrack
              ? firstTrack.title
              : "Ничего не играет";
            audio.src = firstTrack ? firstTrack.src : "";
            playBtn.textContent = "▶";
          }
        }
      }
      function playFrom(bandKey, albumIndex, trackIndex) {
        currentBandKey = bandKey;
        currentAlbumIndex = albumIndex;
        currentTrackIndex = trackIndex;
        const band = LIB[bandKey];
        const album = band.albums[albumIndex];
        const track = album.tracks[trackIndex];

        audio.src = track.src;
        enableLeveling().then(() => audio.play())
          .then(() => {
            playBtn.textContent = "⏸";
          })
          .catch(() => {
            /* autoplay guard */
          });

        pCover.src = album.cover || band.cover;
        pArtist.textContent = band.title;
        pTitle.textContent = track.title;
        playBtn.textContent = "⏸";
        updateInlineTracks();
      }

      function updateInlineTracks() {
        document.querySelectorAll('.track').forEach((el) => {
          const active = el.dataset.band === currentBandKey && +el.dataset.albumIndex === currentAlbumIndex && +el.dataset.trackIndex === currentTrackIndex && !!audio.src;
          el.classList.toggle('is-playing', active && !audio.paused);
          const button = el.querySelector('.track-inline-toggle');
          if (button) { button.textContent = active && !audio.paused ? '⏸' : '▶'; button.title = active && !audio.paused ? 'Пауза' : 'Воспроизвести'; }
        });
      }

      function nextTrack() {
        const band = LIB[currentBandKey];
        const album = band.albums[currentAlbumIndex];
        currentTrackIndex = (currentTrackIndex + 1) % album.tracks.length;
        playFrom(currentBandKey, currentAlbumIndex, currentTrackIndex);
      }
      function prevTrack() {
        const band = LIB[currentBandKey];
        const album = band.albums[currentAlbumIndex];
        currentTrackIndex =
          (currentTrackIndex - 1 + album.tracks.length) % album.tracks.length;
        playFrom(currentBandKey, currentAlbumIndex, currentTrackIndex);
      }
      function togglePlay() {
        if (audio.paused) {
          enableLeveling().then(() => audio.play());
          playBtn.textContent = "⏸";
        } else {
          audio.pause();
          playBtn.textContent = "▶";
        }
      }

      // Прогресс/время/перемотка
      audio.addEventListener("timeupdate", () => {
        const { currentTime, duration } = audio;
        pCur.textContent = mmss(currentTime);
        pDur.textContent = mmss(duration);
        const pct = duration ? (currentTime / duration) * 100 : 0;
        progressBar.style.width = pct + "%";
        updateInlineTracks();
      });
      audio.addEventListener("ended", nextTrack);
      audio.addEventListener("play", () => {
        playBtn.textContent = "⏸";
        updateInlineTracks();
        if (window.parent !== window) {
          window.parent.postMessage(
            { type: "shunder:band-audio-play" },
            window.location.origin
          );
        }
      });
      audio.addEventListener("pause", () => { playBtn.textContent = "▶"; updateInlineTracks(); });
      window.addEventListener("message", (event) => {
        if (
          event.origin === window.location.origin &&
          event.data?.type === "shunder:radio-play"
        ) {
          audio.pause();
          playBtn.textContent = "▶";
        }
      });
      progressWrap.addEventListener("click", (e) => {
        const rect = progressWrap.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        audio.currentTime = ratio * (audio.duration || 0);
      });

      prevBtn.addEventListener("click", prevTrack);
      nextBtn.addEventListener("click", nextTrack);
      playBtn.addEventListener("click", togglePlay);

      // Смена группы
      document.querySelectorAll(".group-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-band");
          if (window.innerWidth < 992) {
            renderBand(key, "modal");
            const m = bootstrap.Modal.getOrCreateInstance(albumsModalEl);
            m.show();
          } else {
            renderBand(key, "desktop");
          }
        });
      });

      function renderPlaceholder() {
        // Desktop
        bandTitle.textContent = "Группы";
        linksBar.innerHTML = "";
        albumsWrap.innerHTML = `
          <div class="alert alert-secondary" role="alert">
            В данном разделе, вы можете ознакомиться и послушать материалы ныне действующих коллективов.
            Для этого выберите интересующий вас в списке.
          </div>
        `;

        // Modal
        bandTitleModal.textContent = "Группы";
        linksBarModal.innerHTML = "";
        albumsWrapModal.innerHTML = `
          <div class="alert alert-secondary" role="alert">
            В данном разделе, вы можете ознакомиться и послушать материалы ныне действующих коллективов.
            Для этого выберите интересующий вас в списке.
          </div>
        `;

        // Mobile placeholder (под списком групп)
        const mobilePlaceholder = document.getElementById("mobilePlaceholder");
        if (mobilePlaceholder) {
          mobilePlaceholder.innerHTML = `
            <div class="alert alert-secondary" role="alert">
              В данном разделе, вы можете ознакомиться и послушать материалы ныне действующих коллективов.
              Для этого выберите интересующий вас в списке.
            </div>
          `;
        }

        // Сброс плеера
        pCover.src =
          "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg==";

        pArtist.textContent = "";
        pTitle.textContent = "Ничего не играет";
        audio.src = "";
        playBtn.textContent = "▶";
      }

      // Инициализация
      function init() {
        renderPlaceholder();
      }
      document.addEventListener("DOMContentLoaded", init);
    </script>
    <script src="/js/site-shell.js"></script>
  </body>
</html>
