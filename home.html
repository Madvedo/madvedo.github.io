<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шаховское Подполье</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <style>
      .rounded-img {
        width: 60%;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
        padding: 0.6em;
        margin-bottom: 1em;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        cursor: pointer;
      }

      .rounded-img:hover {
        transform: scale(1.08);
        box-shadow: 0 0 30px rgba(0, 255, 38, 0.746), 0 0 60px rgba(0, 123, 255, 0.6);
      }

      a { text-decoration: none; color: black; }
      .latest-news { max-width:100%; padding: 0 0 24px; overflow:hidden; }
      .latest-news h3 { margin-bottom: 14px; }
      .latest-news-grid { --gap:18px; display:flex; align-items:center; gap:var(--gap); width:min(1050px,100%); margin:auto; overflow:hidden; padding:30px 0; scroll-behavior:smooth; }
      .latest-news-card { position:relative; display:block; flex:0 0 calc((100% - 4 * var(--gap)) / 5); min-width:0; overflow:hidden; padding:5px; border:1px solid #cbd2d9; border-radius:12px; background:linear-gradient(145deg,#f8fafc,#9ba7b2); box-shadow:0 5px 18px rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.72); transform:scale(.86); opacity:.6; transition:transform .45s ease,opacity .45s ease,box-shadow .45s ease; }
      .latest-news-card.is-active { z-index:2; border-color:#d7ad45; background:linear-gradient(145deg,#fff0a8,#b57a17); box-shadow:0 9px 28px rgba(130,85,0,.4),inset 0 0 0 2px rgba(255,250,210,.82); transform:scale(1.15); opacity:1; }
      .latest-news-card:hover { opacity:1; box-shadow:0 0 24px rgba(0,123,255,.5); }
      .latest-news-card img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:7px; }
      .latest-news-title { position:absolute; inset:auto 0 0; padding:10px 8px; color:#fff; font-size:.8rem; font-weight:600; background:linear-gradient(transparent,rgba(0,0,0,.88)); opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; text-shadow:0 1px 3px #000; }
      .latest-news-card:hover .latest-news-title, .latest-news-card:focus-visible .latest-news-title { opacity:1; transform:none; }
      body.in-shell main { padding: 12px; }
      body.in-shell .rounded-img { width: min(60%, 300px); }
      body.in-shell .container.my-5 { margin-top: 1.5rem !important; margin-bottom: 1.5rem !important; }
      @media (max-width: 575.98px) {
        .latest-news-grid { --gap:7px; padding-top:22px; padding-bottom:22px; }
        .latest-news-title { padding:7px 5px; font-size:.62rem; }
        body.in-shell main { padding: 10px 0; }
        h1 { font-size: 1.55rem; }
        h2 { font-size: 1.1rem; }
        body.in-shell .rounded-img { width: min(72%, 260px); }
        body.in-shell .container.my-5 { margin-top: 1rem !important; margin-bottom: 1rem !important; }
        .lead.my-5 { margin-top: 1.25rem !important; margin-bottom: 1.25rem !important; }
      }
    </style>
  </head>
  <body>
    <main class="container text-center">
      <div class="row">
        <div class="col-lg-6 col-md-8 mx-auto">
          <h1 class="fw-light">ШАХОВСКОЕ ПОДПОЛЬЕ</h1>
          <h2>Творческий мир на задворках <br />Московской области</h2>
          <a href="https://vk.com/shah_underground" target="_blank" rel="noopener noreferrer">
            <img class="rounded-img" src="/1.jpg" alt="Шаховское Подполье" />
          </a>
          <div class="container my-5">
            <a href="https://vk.com/audios-20613122" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">VK Аудио</a>
            <a href="https://vkvideo.ru/@shah_underground" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">VK Видео</a>
            <p class="lead my-5 text-muted">
              История, которая пишется сейчас. <br />
              Дата создания сообщества — 11.10.2010. <br />
              Добро пожаловать!
            </p>
          </div>
        </div>
      </div>
    </main>
    <section class="latest-news container text-center" id="latestNews"><h3>Последние новости</h3><div class="latest-news-grid"></div></section>
    <script src="/js/content-runtime.js"></script>
    <script src="/js/site-shell.js"></script>
  </body>
</html>
