<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Онлайн Радио</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #111;
        color: #eee;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      h1 {
        margin: 30px 0 10px;
        text-align: center;
      }

      .player {
        margin: 40px auto;
        max-width: 600px;
        padding: 20px;
        background: #1c1c1c;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }

      /* Кастомная панель прогресса */
      .progress-wrap {
        margin-top: 20px;
        user-select: none;
      }
      .progress-track {
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: #2b2b2b;
        cursor: pointer;
        touch-action: none;
      }
      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: linear-gradient(90deg, #ff9800, #ff5722);
        border-radius: 999px;
        pointer-events: none; /* чтобы клики шли по контейнеру */
      }
      .thumb {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.9;
        box-shadow: 0 0 10px rgba(255, 87, 34, 0.6);
        pointer-events: none; /* не перехватывать события */
      }
      .time {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-top: 6px;
        color: #aaa;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 16px;
      }
      .control-btn {
        background: #333;
        border: none;
        color: #fff;
        font-size: 26px;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s, transform 0.08s;
      }
      .control-btn:hover {
        background: #555;
        transform: scale(1.05);
      }

      /* Навбар как у тебя */
      .navbar {
      }
    </style>
  </head>
  <body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/"
          ><img src="Logo.png" alt="ShUn1" width="40"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>

              <a class="nav-link" href="concerts.html">Фотоархив</a>

            </li>

    <h1>🎵 Онлайн Радио</h1>

    <div class="player">
      <div id="track-title">Загрузка списка треков...</div>

      <!-- Скрытый нативный плеер -->
      <audio id="audio"></audio>

      <!-- Кастомная панель прогресса -->
      <div class="progress-wrap">
        <div
          class="progress-track"
          id="progressTrack"
          aria-label="Шкала воспроизведения"
        >
          <div class="progress-fill" id="progressFill"></div>
          <div class="thumb" id="thumb" style="left: 0%"></div>
        </div>
        <div class="time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <!-- Кнопки -->
      <div class="controls">
        <button class="control-btn" id="btnPlay" title="Пуск/Пауза">
          <i id="playIcon" class="bi bi-play-fill"></i>
        </button>
        <button class="control-btn" id="btnNext" title="Следующий трек">
          <i class="bi bi-skip-forward-fill"></i>
        </button>
      </div>
    </div>

    <script>
      // === ДАННЫЕ ===
      let tracks = [];
      let queue = [];
      let currentTrack = null;
      let rafId = null;
      let scrubbing = false;

      // === ЭЛЕМЕНТЫ ===
      const audio = document.getElementById("audio");
      const titleEl = document.getElementById("track-title");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const playIcon = document.getElementById("playIcon");

      const progressTrack = document.getElementById("progressTrack");
      const progressFill = document.getElementById("progressFill");
      const thumb = document.getElementById("thumb");
      const curEl = document.getElementById("current-time");
      const durEl = document.getElementById("duration");

      // === ЗАГРУЗКА СПИСКА ===
      async function loadTracks() {
        try {
          const res = await fetch("tracks.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("Не удалось загрузить tracks.json");
          tracks = await res.json();
          if (!Array.isArray(tracks) || tracks.length === 0) {
            titleEl.textContent = "В папке radio нет треков";
            return;
          }
          resetQueue();
          playNext();
        } catch (err) {
          titleEl.textContent = "Ошибка: " + err.message;
        }
      }

      // === ПЛЕЙЛИСТ БЕЗ ПОВТОРОВ (SHUFFLE) ===
      function resetQueue() {
        queue = [...tracks];
        // Фишер-Йетс
        for (let i = queue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [queue[i], queue[j]] = [queue[j], queue[i]];
        }
      }

      function playNext() {
        if (queue.length === 0) resetQueue();
        currentTrack = queue.shift();
        const src = encodeURI(currentTrack);
        audio.src = src;
        audio.play().catch(() => {
          titleEl.textContent = "Нажмите «Пуск», чтобы начать";
        });
        titleEl.textContent = "Сейчас играет: " + currentTrack.split("/").pop();
      }

      // === КНОПКИ ===
      btnPlay.addEventListener("click", () =>
        audio.paused ? audio.play() : audio.pause()
      );
      btnNext.addEventListener("click", playNext);

      // === ОТОБРАЖЕНИЕ ИКОНКИ PLAY/PAUSE ===
      function updatePlayIcon() {
        playIcon.className = audio.paused
          ? "bi bi-play-fill"
          : "bi bi-pause-fill";
      }

      // === ФОРМАТ ВРЕМЕНИ ===
      function t(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" + s : s);
      }

      // === ПРОГРЕСС (без лагов через rAF) ===
      function loop() {
        if (!audio.paused && !scrubbing && audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + "%";
          thumb.style.left = percent + "%";
          curEl.textContent = t(audio.currentTime);
          durEl.textContent = t(audio.duration);
        }
        rafId = requestAnimationFrame(loop);
      }

      // Запускаем/останавливаем rAF
      audio.addEventListener("play", () => {
        updatePlayIcon();
        cancelAnimationFrame(rafId);
        loop();
      });
      audio.addEventListener("pause", () => {
        updatePlayIcon();
      });
      audio.addEventListener("ended", () => {
        updatePlayIcon();
        playNext();
      });

      audio.addEventListener("loadedmetadata", () => {
        durEl.textContent = t(audio.duration);
      });

      // === СКРАББИНГ (клик/перетаскивание) ===
      function seekFromEvent(ev) {
        const rect = progressTrack.getBoundingClientRect(); // именно контейнер!
        const x = Math.min(Math.max(ev.clientX - rect.left, 0), rect.width);
        const percent = x / rect.width;
        if (audio.duration) {
          audio.currentTime = percent * audio.duration;
          const pct = percent * 100;
          progressFill.style.width = pct + "%";
          thumb.style.left = pct + "%";
          curEl.textContent = t(audio.currentTime);
        }
      }

      progressTrack.addEventListener("pointerdown", (ev) => {
        scrubbing = true;
        progressTrack.setPointerCapture(ev.pointerId);
        seekFromEvent(ev);
      });

      progressTrack.addEventListener("pointermove", (ev) => {
        if (scrubbing) seekFromEvent(ev);
      });

      progressTrack.addEventListener("pointerup", (ev) => {
        scrubbing = false;
        seekFromEvent(ev);
      });

      // Старт
      window.addEventListener("load", loadTracks);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
