<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="yandex-verification" content="ecefa5a9732deddc" />
    <title>Онлайн Радио</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Подключим красивый шрифт -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, sans-serif;
        color: #eee;
        overflow: hidden;
      }

      /* Фоновое видео */
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }
      .video-background video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Центровка содержимого */
      .main-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
      }

      /* Заголовок */
      h1 {
        margin-bottom: 30px;
        font-family: "Montserrat", sans-serif;
        font-size: 3rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 12px rgba(255, 87, 34, 0.8);

        display: inline-block;
        padding: 14px 32px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 152, 0, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6),
          0 0 18px rgba(255, 87, 34, 0.4);
      }

      /* Плеер */
      .player {
        width: 100%;
        max-width: 600px;
        padding: 25px;
        background: rgba(0, 0, 0, 0.55); /* более прозрачный */
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px); /* РАЗМЫТИЕ ФОНА */
        -webkit-backdrop-filter: blur(12px); /* для Safari */
      }

      /* Кастомная панель прогресса */
      .progress-wrap {
        margin-top: 20px;
        user-select: none;
      }
      .progress-track {
        position: relative;
        height: 10px;
        border-radius: 999px;
        background: #2b2b2b;
        cursor: pointer;
        touch-action: none;
      }
      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: linear-gradient(90deg, #ff9800, #ff5722);
        border-radius: 999px;
      }
      .thumb {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.95;
        box-shadow: 0 0 12px rgba(255, 87, 34, 0.7);
      }
      .time {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-top: 8px;
        color: #ccc;
      }

      /* Кнопки */
      .controls {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-top: 20px;
      }
      .control-btn {
        background: #333;
        border: none;
        color: #fff;
        font-size: 28px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s, transform 0.08s;
      }
      .control-btn:hover {
        background: #555;
        transform: scale(1.08);
      }
    </style>
  </head>
  <body>
    <!-- Фон-видео -->
    <div class="video-background">
      <video autoplay muted loop playsinline>
        <source src="video/bckg.webm" type="video/webm" />
        <source src="video/bckg.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/"
          ><img src="Logo.png" alt="ShUn1" width="40"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="concerts.html">Фотоархив</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="bands.html">Группы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="hs.html">История</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">О проекте</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="radio.html">Радио</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Центровка -->
    <div class="main-wrap">
      <h1>🎶Радио "Подполье"🎶</h1>
      <div class="player">
        <div id="track-title">Загрузка списка треков...</div>
        <audio id="audio"></audio>

        <!-- Прогресс -->
        <div class="progress-wrap">
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="thumb" id="thumb" style="left: 0%"></div>
          </div>
          <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <!-- Кнопки -->
        <div class="controls">
          <button class="control-btn" id="btnPlay" title="Пуск/Пауза">
            <i id="playIcon" class="bi bi-play-fill"></i>
          </button>
          <button class="control-btn" id="btnNext" title="Следующий трек">
            <i class="bi bi-skip-forward-fill"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Скрипт -->
    <script>
      let tracks = [],
        queue = [],
        currentTrack = null,
        rafId = null,
        scrubbing = false;
      const audio = document.getElementById("audio");
      const titleEl = document.getElementById("track-title");
      const btnPlay = document.getElementById("btnPlay");
      const btnNext = document.getElementById("btnNext");
      const playIcon = document.getElementById("playIcon");
      const progressTrack = document.getElementById("progressTrack");
      const progressFill = document.getElementById("progressFill");
      const thumb = document.getElementById("thumb");
      const curEl = document.getElementById("current-time");
      const durEl = document.getElementById("duration");

      async function loadTracks() {
        try {
          const res = await fetch("tracks.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("Не удалось загрузить tracks.json");
          tracks = await res.json();
          if (!Array.isArray(tracks) || tracks.length === 0) {
            titleEl.textContent = "В папке radio нет треков";
            return;
          }
          resetQueue();
          playNext();
        } catch (err) {
          titleEl.textContent = "Ошибка: " + err.message;
        }
      }
      function resetQueue() {
        queue = [...tracks];
        for (let i = queue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [queue[i], queue[j]] = [queue[j], queue[i]];
        }
      }
      function playNext() {
        if (queue.length === 0) resetQueue();
        currentTrack = queue.shift();
        audio.src = encodeURI(currentTrack);
        audio
          .play()
          .catch(() => (titleEl.textContent = "Нажмите «Пуск», чтобы начать"));

        // тут убираем расширение
        let name = currentTrack
          .split("/")
          .pop()
          .replace(/\.[^/.]+$/, "");
        titleEl.textContent = "Сейчас играет: " + name;
      }
      btnPlay.addEventListener("click", () =>
        audio.paused ? audio.play() : audio.pause()
      );
      btnNext.addEventListener("click", playNext);
      function updatePlayIcon() {
        playIcon.className = audio.paused
          ? "bi bi-play-fill"
          : "bi bi-pause-fill";
      }
      function t(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60),
          s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" + s : s);
      }
      function loop() {
        if (!audio.paused && !scrubbing && audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + "%";
          thumb.style.left = percent + "%";
          curEl.textContent = t(audio.currentTime);
          durEl.textContent = t(audio.duration);
        }
        rafId = requestAnimationFrame(loop);
      }
      audio.addEventListener("play", () => {
        updatePlayIcon();
        cancelAnimationFrame(rafId);
        loop();
      });
      audio.addEventListener("pause", updatePlayIcon);
      audio.addEventListener("ended", () => {
        updatePlayIcon();
        playNext();
      });
      audio.addEventListener(
        "loadedmetadata",
        () => (durEl.textContent = t(audio.duration))
      );
      function seekFromEvent(ev) {
        const rect = progressTrack.getBoundingClientRect();
        const x = Math.min(Math.max(ev.clientX - rect.left, 0), rect.width);
        const percent = x / rect.width;
        if (audio.duration) {
          audio.currentTime = percent * audio.duration;
          const pct = percent * 100;
          progressFill.style.width = pct + "%";
          thumb.style.left = pct + "%";
          curEl.textContent = t(audio.currentTime);
        }
      }
      progressTrack.addEventListener("pointerdown", (ev) => {
        scrubbing = true;
        progressTrack.setPointerCapture(ev.pointerId);
        seekFromEvent(ev);
      });
      progressTrack.addEventListener("pointermove", (ev) => {
        if (scrubbing) seekFromEvent(ev);
      });
      progressTrack.addEventListener("pointerup", (ev) => {
        scrubbing = false;
        seekFromEvent(ev);
      });
      window.addEventListener("load", loadTracks);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
