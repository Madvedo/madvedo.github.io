<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Онлайн Радио</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #111;
        color: #eee;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      h1 {
        margin: 30px 0 10px;
        text-align: center;
      }
      .player {
        margin: 40px auto;
        text-align: center;
        max-width: 600px;
        padding: 20px;
      }
      audio {
        width: 100%;
        max-width: 400px;
        margin-top: 20px;
      }
      button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #444;
        color: #fff;
        transition: background 0.3s;
      }
      button:hover {
        background: #666;
      }
      #track-title {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/">
          <img src="Logo.png" alt="ShUn1" width="40" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Переключить меню"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="concerts.html">Фотоархив</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="bands.html">Группы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="hs.html">История</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">О проекте</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="radio.html">Радио</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <h1>🎵 Онлайн Радио</h1>

    <div class="player">
      <audio id="audio" controls autoplay></audio>
      <div id="track-title">Загрузка списка треков...</div>
      <div>
        <button onclick="togglePlay()">⏯ Пауза/Плей</button>
        <button onclick="playRandom()">⏭ Следующий</button>
      </div>
    </div>

    <script>
      let tracks = [];
      const audio = document.getElementById("audio");
      const trackTitle = document.getElementById("track-title");

      async function loadTracks() {
        try {
          const response = await fetch("tracks.json");
          if (!response.ok) {
            throw new Error("Не удалось загрузить tracks.json");
          }
          tracks = await response.json();
          if (tracks.length === 0) {
            trackTitle.textContent = "В папке radio нет треков";
            return;
          }
          playRandom();
        } catch (e) {
          trackTitle.textContent = "Ошибка: " + e.message;
        }
      }

      function getRandomTrack() {
        const randomIndex = Math.floor(Math.random() * tracks.length);
        return tracks[randomIndex];
      }

      function playRandom() {
        if (tracks.length === 0) return;
        const track = getRandomTrack();
        audio.src = track;
        audio.play().catch(() => {
          trackTitle.textContent = "Нажмите Play, чтобы начать воспроизведение";
        });
        trackTitle.textContent =
          "Сейчас играет: " + decodeURIComponent(track.split("/").pop());
      }

      function togglePlay() {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      }

      audio.addEventListener("ended", playRandom);
      window.addEventListener("load", loadTracks);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
