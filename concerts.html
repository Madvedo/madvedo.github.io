<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="yandex-verification" content="ecefa5a9732deddc" />
    <title>Фотоальбом</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <style>
      :root {
        --card-bg: #ffffff;
        --card-br: #e0e0e0;
        --txt: #000000;
      }

      body {
        padding-top: 70px;
        background: #ffffff;
        color: var(--txt);
      }

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1030;
      }

      .navbar .navbar-brand img {
        width: 40px;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 24px 0 12px;
      }

      .page-title {
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      /* Галерея */
      .album-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      @media (min-width: 576px) {
        .album-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 992px) {
        .album-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 1400px) {
        .album-grid {
          grid-template-columns: repeat(6, 1fr);
        }
      }

      .photo-card {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background: var(--card-bg);
        border: 1px solid var(--card-br);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease,
          border-color 0.2s;
      }

      .photo-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        aspect-ratio: 1 / 1;
      }

      /* Модалка с каруселью */
      .modal-dark .modal-content {
        background: #252525;
        color: white;
        border: 1px solid #404144;
      }

      .carousel-item img {
        max-height: 80vh;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        margin: auto;
        display: block;
      }

      .carousel-caption {
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
        padding: 0.25rem 0.5rem;
        bottom: 10px;
      }
    </style>
  </head>
  <body>
    <!-- NAV -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="/">
          <img src="Logo.png" alt="ShUn1" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Переключить навигацию"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-2">
            <li class="nav-item">
              <a class="nav-link" href="/news.html">Новости</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="concerts.html">Фотоархив</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="bands.html">Группы</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="hs.html">История</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">О проекте</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="radio.html">Радио</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->
    <main class="container my-3">
      <div class="page-header">
        <h1 class="page-title">Фотоальбом</h1>
        <a
          href="https://vk.com/albums-20613122"
          target="_blank"
          class="btn btn-primary"
          rel="noopener"
        >
          Больше фото в VK
        </a>
      </div>

      <!-- Галерея миниатюр -->
      <div id="albumGrid" class="album-grid" aria-live="polite"></div>
    </main>

    <!-- MODAL: Просмотр фото (карусель) -->
    <div
      class="modal fade modal-dark"
      id="viewerModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-fullscreen-sm-down modal-xl modal-dialog-centered"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Просмотр</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Закрыть"
            ></button>
          </div>
          <div class="modal-body p-0">
            <div
              id="albumCarousel"
              class="carousel slide"
              data-bs-interval="false"
            >
              <div class="carousel-indicators" id="carouselIndicators"></div>
              <div class="carousel-inner" id="carouselInner"></div>

              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#albumCarousel"
                data-bs-slide="prev"
                aria-label="Предыдущее"
              >
                <span
                  class="carousel-control-prev-icon"
                  aria-hidden="true"
                ></span>
              </button>
              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#albumCarousel"
                data-bs-slide="next"
                aria-label="Следующее"
              >
                <span
                  class="carousel-control-next-icon"
                  aria-hidden="true"
                ></span>
              </button>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <div class="small text-muted">
              <span id="counterLabel">1 / 1</span>
            </div>
            <button class="btn btn-outline-light" data-bs-dismiss="modal">
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script>
      const USE_THUMBS = false; // если есть миниатюры в /thumbs — можно включить

      async function getPhotoList() {
        try {
          const res = await fetch("/img/photoalbum/manifest.json", {
            cache: "no-store",
          });
          if (!res.ok) throw new Error("no manifest");
          const arr = await res.json();
          if (Array.isArray(arr) && arr.length) return arr;
          return [];
        } catch (e) {
          console.error("manifest.json error:", e);
          return [];
        }
      }

      const albumGrid = document.getElementById("albumGrid");
      const viewerModalEl = document.getElementById("viewerModal");
      const carouselEl = document.getElementById("albumCarousel");
      const carouselInner = document.getElementById("carouselInner");
      const carouselIndicators = document.getElementById("carouselIndicators");
      const counterLabel = document.getElementById("counterLabel");
      let carousel;
      let images = [];

      function buildGrid(files) {
        albumGrid.innerHTML = "";
        files.forEach((file, idx) => {
          const card = document.createElement("div");
          card.className = "photo-card";
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = USE_THUMBS
            ? `/img/photoalbum/thumbs/${file}`
            : `/img/photoalbum/${file}`;
          img.alt = file;
          card.appendChild(img);
          card.addEventListener("click", () => openViewer(idx));
          albumGrid.appendChild(card);
        });
      }

      function buildCarousel(files, startIndex = 0) {
        carouselInner.innerHTML = "";
        carouselIndicators.innerHTML = "";

        files.forEach((file, i) => {
          const indicator = document.createElement("button");
          indicator.type = "button";
          indicator.setAttribute("data-bs-target", "#albumCarousel");
          indicator.setAttribute("data-bs-slide-to", String(i));
          indicator.setAttribute("aria-label", `Слайд ${i + 1}`);
          if (i === startIndex) {
            indicator.classList.add("active");
            indicator.setAttribute("aria-current", "true");
          }
          carouselIndicators.appendChild(indicator);

          const item = document.createElement("div");
          item.className =
            "carousel-item" + (i === startIndex ? " active" : "");
          const img = document.createElement("img");
          img.src = `/img/photoalbum/${file}`;
          img.alt = file;
          img.className = "d-block";
          img.decoding = "async";
          img.loading = "eager";
          item.appendChild(img);

          const caption = document.createElement("div");
          caption.className = "carousel-caption p-2";
          caption.innerHTML = `<small>${i + 1} / ${
            files.length
          } — ${file}</small>`;
          item.appendChild(caption);

          carouselInner.appendChild(item);
        });

        counterLabel.textContent = `${startIndex + 1} / ${files.length}`;
        if (!carousel) {
          carousel = new bootstrap.Carousel(carouselEl, {
            interval: false,
            ride: false,
            keyboard: false,
            pause: false,
          });
          carouselEl.addEventListener("slid.bs.carousel", (ev) => {
            const activeIdx = ev.to;
            counterLabel.textContent = `${activeIdx + 1} / ${files.length}`;
          });
        } else {
          carousel.to(startIndex);
        }
      }

      function openViewer(index) {
        buildCarousel(images, index);
        const modal = new bootstrap.Modal(viewerModalEl);
        modal.show();
      }

      viewerModalEl.addEventListener("keydown", (e) => {
        if (!carousel) return;
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          carousel.prev();
        }
        if (e.key === "ArrowRight") {
          e.preventDefault();
          carousel.next();
        }
      });

      (async () => {
        images = await getPhotoList();
        buildGrid(images);
      })();
    </script>
    <script src="/js/site-shell.js"></script>
  </body>
</html>
