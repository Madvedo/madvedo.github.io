<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор · Шаховское Подполье</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#101317;color:#eef1f4}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:20px;background:#181c21}.work{padding:20px}.nav-pills .nav-link{color:#cbd1d8;text-align:left}.nav-pills .nav-link.active{background:#fd7e14}.panel{background:#20252b;border:1px solid #3b424a;border-radius:14px;padding:16px}.preview{width:100%;height:68vh;border:0;border-radius:10px;background:white}.hint{color:#9da7b1;font-size:.9rem}.asset{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #343a40}.asset span{flex:1;overflow:hidden;text-overflow:ellipsis}.toastbox{position:fixed;right:20px;bottom:20px;z-index:9}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3}.preview{height:60vh}}
</style></head><body><div class="app"><aside class="side"><h4>Конструктор</h4><p class="hint">Изменения публикуются только после сохранения.</p><div class="nav nav-pills flex-column" id="tabs">
<button class="nav-link active" data-page="home.html">Главная</button><button class="nav-link" data-page="news.html">Новости</button><button class="nav-link" data-page="bands.html">Группы</button><button class="nav-link" data-page="hs.html">История</button><button class="nav-link" data-page="About.html">О проекте</button><button class="nav-link" data-page="concerts.html">Фотоархив</button><button class="nav-link" data-page="radio">Радио</button></div><hr><a href="/" class="btn btn-outline-light w-100">Открыть сайт</a></aside>
<main class="work"><div id="pageEditor" class="panel"><div class="d-flex gap-2 flex-wrap align-items-center mb-3"><b id="pageName"></b><span class="hint">Нажмите на текст в макете и редактируйте прямо там. Del удаляет выбранный блок.</span><button id="addBlock" class="btn btn-outline-light btn-sm ms-auto">Дублировать блок</button><label class="btn btn-outline-light btn-sm">Заменить картинку<input id="replaceImage" type="file" accept="image/*" hidden></label><button id="savePage" class="btn btn-warning">Сохранить изменения</button></div><iframe id="preview" class="preview"></iframe></div>
<div id="assets" class="panel d-none"><h4 id="assetsTitle"></h4><div class="d-flex gap-2 mb-3"><input id="assetUpload" type="file" class="form-control" multiple><button id="uploadAssets" class="btn btn-warning">Добавить</button></div><div id="assetList"></div></div></main></div><div id="toast" class="toastbox alert d-none"></div>
<script>
const api='/construct-api'; const preview=document.querySelector('#preview'); let current='home.html', selected=null;
function toast(message,ok=true){const el=document.querySelector('#toast');el.textContent=message;el.className=`toastbox alert alert-${ok?'success':'danger'}`;setTimeout(()=>el.classList.add('d-none'),3500)}
async function request(path,options={}){const r=await fetch(api+path,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Ошибка сервера');return data}
function editable(){const d=preview.contentDocument;d.designMode='on';d.addEventListener('click',e=>{selected=e.target;d.querySelectorAll('.constructor-selected').forEach(x=>x.classList.remove('constructor-selected'));selected.classList.add('constructor-selected')});const s=d.createElement('style');s.textContent='.constructor-selected{outline:3px solid #ff7a00!important;outline-offset:2px}';d.head.append(s)}
async function openPage(file){current=file;document.querySelector('#pageEditor').classList.remove('d-none');document.querySelector('#assets').classList.add('d-none');document.querySelector('#pageName').textContent=file;preview.src='/'+file+'?construct='+Date.now();preview.onload=editable}
async function openAssets(type){document.querySelector('#pageEditor').classList.add('d-none');document.querySelector('#assets').classList.remove('d-none');document.querySelector('#assetsTitle').textContent=type==='radio'?'Пул песен':'Фотоархив';document.querySelector('#assetUpload').accept=type==='radio'?'audio/*':'image/*';document.querySelector('#assets').dataset.type=type;const s=await request('/state');const list=type==='radio'?s.tracks:s.photos;document.querySelector('#assetList').replaceChildren(...list.map(name=>{const row=document.createElement('div');row.className='asset';const label=document.createElement('span');label.textContent=name;const del=document.createElement('button');del.className='btn btn-sm btn-outline-danger';del.textContent='Удалить';del.onclick=async()=>{if(!confirm('Удалить файл без возможности восстановления?'))return;await request('/asset',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,name})});toast('Удалено');openAssets(type)};row.append(label,del);return row}))}
document.querySelector('#tabs').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('#tabs .nav-link').forEach(x=>x.classList.remove('active'));b.classList.add('active');b.dataset.page==='radio'?openAssets('radio'):b.dataset.page==='concerts.html'?openAssets('photo'):openPage(b.dataset.page)};
document.querySelector('#addBlock').onclick=()=>{if(!selected)return toast('Сначала выберите блок',false);const candidates=['.news-block','.band-card','.band-item','.list-group-item','.card','article'];const block=selected.closest(candidates.join(','))||selected;block.after(block.cloneNode(true));editable()};
document.addEventListener('keydown',e=>{if(e.key==='Delete'&&selected&&confirm('Удалить выбранный элемент?')){selected.remove();selected=null}});
document.querySelector('#replaceImage').onchange=async e=>{if(!selected)return toast('Сначала выберите картинку',false);const img=selected.closest('img')||selected.querySelector?.('img');if(!img)return toast('Выбранный элемент не содержит картинку',false);const f=e.target.files[0],fd=new FormData();fd.append('type','image');fd.append('file',f);const out=await request('/upload',{method:'POST',body:fd});img.src=out.url+'?v='+Date.now();toast('Картинка загружена; сохраните страницу')};
document.querySelector('#savePage').onclick=async()=>{const d=preview.contentDocument;d.designMode='off';d.querySelectorAll('.constructor-selected').forEach(x=>x.classList.remove('constructor-selected'));d.querySelectorAll('style').forEach(x=>{if(x.textContent.includes('.constructor-selected'))x.remove()});await request('/page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:current,html:'<!DOCTYPE html>\n'+d.documentElement.outerHTML})});toast('Изменения опубликованы');editable()};
document.querySelector('#uploadAssets').onclick=async()=>{const type=document.querySelector('#assets').dataset.type,files=document.querySelector('#assetUpload').files;if(!files.length)return;for(const file of files){const fd=new FormData();fd.append('type',type);fd.append('file',file);await request('/upload',{method:'POST',body:fd})}toast('Файлы добавлены');openAssets(type)};openPage(current);
</script></body></html>
